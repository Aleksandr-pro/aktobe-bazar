name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - uses: Swatinem/rust-cache@v2
      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked
      - name: Build release APK
        working-directory: crates/mobile-game
        run: cargo quad-apk build --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-voxel-android-${{ github.sha }}
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable alpha APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find target/android-artifacts/release/apk -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" project-voxel-android.apk
          tag="mobile-alpha-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" project-voxel-android.apk \
            --target "$GITHUB_SHA" \
            --title "Project Voxel Android alpha ${GITHUB_RUN_NUMBER}" \
            --notes "Native Android alpha build from ${GITHUB_SHA}." \
            --prerelease
