name: Native Android APK

# Emulator runs are opt-in: add the `run-emulator` label to a pull request or
# put [emulator] in the commit message.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Prepare Android SDK and NDK
        run: |
          set -euo pipefail
          echo "SDK root: $ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          if [ ! -d "$ndk" ]; then
            ndk="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort | tail -n 1)"
          fi
          test -d "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK: $ndk"

      - name: Add NDK toolchain compatibility wrappers
        run: |
          set -euo pipefail
          trap 'echo "::error title=NDK wrappers::$BASH_COMMAND"' ERR
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          prebuilt="$(dirname "$bin")"
          # cargo triple | ndk clang prefix | unwind arch directory
          while read -r triple clang_prefix arch; do
            for prefix in "$triple" "$clang_prefix" "$(echo "$triple" | sed 's/^armv7/arm/')"; do
              for tool in ar ranlib nm strip objdump readelf; do
                target="$bin/$prefix-$tool"
                if [ ! -e "$target" ] && [ -e "$bin/llvm-$tool" ]; then
                  ln -s "llvm-$tool" "$target"
                fi
              done
            done
            unwind="$(find "$prebuilt" -name 'libunwind.a' -path "*/$arch/*" -print 2>/dev/null | sort | head -n 1)"
            test -n "$unwind"
            for prefix in "$triple" "$clang_prefix" "$(echo "$triple" | sed 's/^armv7/arm/')"; do
              linker="$bin/$prefix-ld"
              if [ ! -e "$linker" ]; then
                {
                  echo "#!/bin/sh"
                  echo "exec \"$bin/ld.lld\" -L\"$(dirname "$unwind")\" \"\$@\""
                } > "$linker"
                chmod +x "$linker"
              fi
            done
            echo "prepared $triple"
          done <<'TARGETS'
          armv7-linux-androideabi armv7a-linux-androideabi arm
          aarch64-linux-android aarch64-linux-android aarch64
          x86_64-linux-android x86_64-linux-android x86_64
          TARGETS

      - name: Install cargo-quad-apk
        run: |
          set -o pipefail
          if ! cargo install --git https://github.com/not-fl3/cargo-quad-apk --locked --force 2>&1 | tee /tmp/quad-apk-install.log; then
            echo "git install failed, falling back to the published crate"
            cargo install cargo-quad-apk --locked --force 2>&1 | tee -a /tmp/quad-apk-install.log
          fi

      - name: Build game APK
        working-directory: crates/mobile-game
        run: |
          set -o pipefail
          cargo quad-apk build --release 2>&1 | tee /tmp/android-build.log

      - name: Build smoke APK
        working-directory: crates/android-smoke
        run: |
          set -o pipefail
          cargo quad-apk build --release 2>&1 | tee /tmp/smoke-build.log

      - name: Report failure log
        if: failure()
        run: |
          for log in /tmp/android-build.log /tmp/smoke-build.log /tmp/quad-apk-install.log; do
            [ -f "$log" ] || continue
            chunk="$(tail -c 3000 "$log" | tr '\n' '|' | sed 's/::/:/g')"
            echo "::error title=$log::${chunk:-empty}"
          done

      - name: Inspect packaged APKs
        if: success()
        run: |
          set -euo pipefail
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          shopt -s nullglob
          for apk in target/android-artifacts/release/apk/*.apk; do
            name=$(basename "$apk" .apk)
            echo "inspecting $apk"
            "$aapt2" dump badging "$apk" > /tmp/badging.txt 2>&1 || true
            badging=$(grep -aE "package:|launchable-activity|native-code" /tmp/badging.txt | tr '\n' '|' | sed 's/::/:/g' | tail -c 500)
            echo "::warning title=$name badging::${badging:-no badging output}"
            entries=$(unzip -l "$apk" | awk 'NR>3 {print $4}' | grep -aE "^(lib/|classes|AndroidManifest|resources)" | tr '\n' ' ')
            echo "::warning title=$name entries::${entries:-empty}"
            for so in $(unzip -l "$apk" | awk 'NR>3 {print $4}' | grep -aE "^lib/.*\.so$"); do
              unzip -p "$apk" "$so" > /tmp/app.so
              align=$("$readelf" -l /tmp/app.so | grep -a "LOAD" | awk '{print $NF}' | sort -u | tr '\n' ' ')
              jni=$("$readelf" --dyn-syms /tmp/app.so | grep -ac "Java_" || true)
              quad=$("$readelf" --dyn-syms /tmp/app.so | grep -ac "quad_main" || true)
              echo "::warning title=$name $so::align=${align:-unknown} jni=$jni quad_main=$quad"
            done
          done

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-voxel-android-${{ github.sha }}
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable APKs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(target/android-artifacts/release/apk/*.apk)
          test ${#apks[@]} -gt 0
          mkdir -p publish
          for apk in "${apks[@]}"; do
            base=$(basename "$apk" .apk)
            case "$base" in
              *smoke*) name=project-voxel-smoke.apk ;;
              *) name=project-voxel-android.apk ;;
            esac
            cp "$apk" "publish/$name"
          done
          ls -l publish
          tag="mobile-alpha-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" publish/*.apk \
            --target "$GITHUB_SHA" \
            --title "Project Voxel Android alpha ${GITHUB_RUN_NUMBER}" \
            --notes "Native Android alpha build from ${GITHUB_SHA}." \
            --prerelease

  emulator-smoke:
    name: Launch APK on an Android emulator
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[emulator]')
      || contains(github.event.pull_request.labels.*.name, 'run-emulator')
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          pattern: project-voxel-android-*
          merge-multiple: true
          path: artifacts
      - name: Locate APK
        id: apk
        run: |
          apk=$(find artifacts -name '*mobile*.apk' -print -quit)
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - name: Boot emulator and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r "$APK_PATH" > /tmp/install.txt 2>&1 || true
            adb shell am start -W -n com.projectvoxel.mobile/.MainActivity > /tmp/start.txt 2>&1 || true
            sleep 25
            adb shell pidof com.projectvoxel.mobile > /tmp/pid.txt 2>/dev/null || true
            adb logcat -d > /tmp/logcat.txt 2>/dev/null || true
      - name: Report emulator result
        if: always()
        run: |
          summary=$(grep -aiE "projectvoxel|SAPP|FATAL|AndroidRuntime|UnsatisfiedLink|linker|panicked|DEBUG" /tmp/logcat.txt 2>/dev/null | tail -c 3200 | tr '\n' '|' | sed 's/::/:/g' || true)
          install=$(tail -c 600 /tmp/install.txt 2>/dev/null | tr '\n' '|' | sed 's/::/:/g' || true)
          start=$(tail -c 900 /tmp/start.txt 2>/dev/null | tr '\n' '|' | sed 's/::/:/g' || true)
          echo "::warning title=adb install::${install:-no install output}"
          echo "::warning title=am start::${start:-no start output}"
          if [ -s /tmp/pid.txt ]; then
            echo "app process is alive: $(cat /tmp/pid.txt)"
            echo "::warning title=emulator logcat::${summary:-no matching log lines}"
          else
            echo "::error title=app did not stay alive::${summary:-no logcat captured}"
            exit 1
          fi
