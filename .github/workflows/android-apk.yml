name: Native Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release APK with Android NDK
        run: |
          if docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -w /root/src/crates/mobile-game \
            notfl3/cargo-apk \
            bash -lc 'set -e; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"; cargo quad-apk build --release' \
            > /tmp/android-build.log 2>&1; then
            cat /tmp/android-build.log
          else
            cat /tmp/android-build.log
            encoded=$(base64 -w0 /tmp/android-build.log)
            echo "::error title=Android build log::$encoded"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: project-voxel-android-${{ github.sha }}
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 14
