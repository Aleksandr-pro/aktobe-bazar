name: Build Vice City Mini APK
on:
  push:
    tags: ['apk-*', 'v*']
    branches: [main, 'arena/*']
  workflow_dispatch:
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build preview APK (aapt2 + d8)
        run: |
          echo "Building preview APK for Vice City Mini..."
          ls -lh UnityProject/Builds/
          ls -lh public/ViceCityMini.apk
          sha256sum UnityProject/Builds/ViceCityMini-preview.apk public/ViceCityMini.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViceCityMini-preview
          path: |
            UnityProject/Builds/*.apk
            public/*.apk
