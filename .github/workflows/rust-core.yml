name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and lint voxel core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: |
          if cargo fmt --all -- --check > /tmp/rustfmt.log 2>&1; then
            cat /tmp/rustfmt.log
          else
            cat /tmp/rustfmt.log
            base64 -w0 /tmp/rustfmt.log > /tmp/rustfmt.b64
            split -b 2400 /tmp/rustfmt.b64 /tmp/rustfmt-part-
            for part in /tmp/rustfmt-part-*; do
              echo "::error title=rustfmt diff part::$(cat "$part")"
            done
            exit 1
          fi
      - name: Run unit tests
        run: |
          set -o pipefail
          if cargo test --workspace 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          chunk="$(tail -c 3500 /tmp/test.log | tr '\n' '|' | sed 's/::/:/g')"
          echo "::error title=cargo test log::${chunk:-no test output captured}"
          exit 1
      - name: Run Clippy
        run: |
          set -o pipefail
          if cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log; then
            exit 0
          fi
          chunk="$(tail -c 3500 /tmp/clippy.log | tr '\n' '|' | sed 's/::/:/g')"
          echo "::error title=cargo clippy log::${chunk:-no clippy output captured}"
          exit 1
