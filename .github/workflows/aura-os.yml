name: AURA//OS

on:
  push:
    paths:
      - 'aura-os/**'
      - '.github/workflows/aura-os.yml'
  pull_request:
    paths:
      - 'aura-os/**'
      - '.github/workflows/aura-os.yml'

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib qemu-system-x86

      - name: Build host simulator and run scripted scenario
        working-directory: aura-os
        run: |
          make sim
          ./build/sim
          python3 host/shot.py

      - name: Build bootable floppy image
        working-directory: aura-os
        run: make all

      - name: Headless QEMU boot smoke test
        working-directory: aura-os
        run: |
          set +e
          timeout 10 qemu-system-i386 -fda aura.img -display none \
            -serial stdio -no-reboot > serial.log 2>&1
          cat serial.log
          grep -q "AURA BOOT SEQUENCE COMPLETE" serial.log

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aura-os-screenshots
          path: aura-os/screenshots/*.png
