[package]
name = "project-voxel-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Minimal native Android smoke test for the Project Voxel engine stack"

[dependencies]
macroquad = "0.4"

[package.metadata.android]
package_name = "com.projectvoxel.smoke"
label = "Voxel Smoke"
android_version = 36
target_sdk_version = 34
min_sdk_version = 26
build_targets = [
    "armv7-linux-androideabi",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "userLandscape"
